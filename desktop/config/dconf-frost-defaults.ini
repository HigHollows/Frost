# FROST desktop defaults — loaded by frost-desktop.sh via:
#   dconf load / < dconf-frost-defaults.ini
#
# Safe to apply narrowly: `dconf load PATH` only resets the specific
# sub-paths present as [bracketed sections] below — it does not touch
# any dconf key outside those sections, so this can't clobber unrelated
# settings.
#
# Depends on three GNOME Shell extensions being installed (frost-desktop.sh
# installs all three): frost-shell@frost-os (this repo), Dash to Dock (the
# dock — a real, well-established extension, not reimplemented here), and
# Blur my Shell (real GL-based blur — St CSS alone can't do backdrop-filter,
# see stylesheet.css's comment on this).

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
gtk-theme='FROST'
icon-theme='Papirus-Dark'
cursor-theme='Adwaita'
font-name='Inter 11'
document-font-name='Inter 11'
monospace-font-name='JetBrains Mono 11'
enable-animations=true
# GNOME 46+'s system accent color is a fixed palette (blue/teal/green/
# yellow/orange/red/pink/purple/slate) — NOT an arbitrary hex. FROST
# Mono (the default preset, monochrome, no hue) maps to 'slate', the
# closest built-in neutral; frost-theme switches this per preset.
accent-color='slate'

[org/gnome/shell]
enabled-extensions=['frost-shell@frost-os', 'dash-to-dock@micxgx.gmail.com', 'blur-my-shell@aunetx', 'Vitals@CoreCoding.com', 'clipboard-indicator@tudmotu.com']
favorite-apps=['org.gnome.Nautilus.desktop', 'guake.desktop', 'org.gnome.TextEditor.desktop', 'firefox.desktop', 'steam.desktop', 'org.gnome.Notes.desktop']

# Vitals' own uuid/key names are LESS CERTAIN than the well-established
# dash-to-dock/blur-my-shell sections above — verify against
# `gsettings list-recursively org.gnome.shell.extensions.vitals` on the
# actual installed version before relying on all of them.
[org/gnome/shell/extensions/vitals]
hot-sensors=['_processor_usage_', '_memory_usage_', '_temperature_temperature_']
position-in-panel=1
use-higher-precision=false
alphabetize=true
hide-icons=false

# Clipboard Indicator (clipboard-indicator@tudmotu.com) — LESS CERTAIN
# than dash-to-dock/blur-my-shell for the same reason as Vitals above;
# verify against `gsettings list-recursively
# org.gnome.shell.extensions.clipboard-indicator` on the installed
# version.
[org/gnome/shell/extensions/clipboard-indicator]
history-size=50
cache-size=50
display-mode=0
strip-text=true
notify-on-copy=false
privatemode=false

# Dock moved to the left edge and shrunk (2026-08) — was a bottom,
# 48px-icon dock; now a compact 32px left-side dock. extend-height
# stays false so it floats as a short strip near the icons rather than
# spanning the full screen height (a common look for a vertical dock,
# deliberately not used here — the point was "smaller", not "taller").
[org/gnome/shell/extensions/dash-to-dock]
dock-position='LEFT'
dock-fixed=false
autohide=true
intellihide=true
extend-height=false
icon-size-fixed=false
dash-max-icon-size=32
background-color='rgb(26,26,26)'
background-opacity=0.25
transparency-mode='FIXED'
running-indicator-style='DOTS'

[org/gnome/shell/extensions/blur-my-shell/panel]
blur=true
brightness=0.6
sigma=15

[org/gnome/shell/extensions/blur-my-shell/overview]
blur=true
pipeline='pipeline_default'

[org/gnome/shell/extensions/blur-my-shell/appfolder]
blur=true

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'
num-workspaces=4

[org/gnome/mutter]
edge-tiling=true
dynamic-workspaces=true
center-new-windows=true

[org/gnome/desktop/notifications]
show-banners=true
show-in-lock-screen=false

# Guake's own show-hide keybinding (below, org/guake/keybindings/global)
# handles Ctrl+Alt+T directly — no GNOME custom-keybinding wrapper
# needed, and having both would just fight over the same shortcut.

[org/gnome/desktop/background]
picture-uri='file:///usr/share/backgrounds/frost/frost-wallpaper.png'
picture-uri-dark='file:///usr/share/backgrounds/frost/frost-wallpaper.png'
primary-color='#0f1419'

# Guake (3.x) stores its config via GSettings/dconf, not a flat .conf
# file — these are the well-known keys; LESS CERTAIN than everything
# above, verify against `gsettings list-recursively org.guake` on the
# actual installed version before relying on all of them.
[org/guake]
window-height=70
window-width=100
use-vte-titles=false

[org/guake/style/font]
style='JetBrains Mono 13'

[org/guake/style/background]
transparency=90

[org/guake/keybindings/global]
show-hide='<Control><Alt>t'

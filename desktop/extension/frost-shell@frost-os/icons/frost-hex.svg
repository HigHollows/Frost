<?xml version="1.0" encoding="UTF-8"?>
<!-- FROST panel indicator icon — a hexagon (the crystalline motif used
     throughout the theme, echoing an ice-crystal facet) with a small
     snowflake glyph inside. Loaded directly by path in extension.js
     (Gio.icon_new_for_string), not through the icon theme's symbolic
     recolor pipeline, so colors are baked in rather than inherited —
     simpler and more reliable than fighting GNOME's symbolic-icon
     lookup rules for a file that isn't installed into hicolor/. -->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- VM-CONFIRMED (2026-08): the original 1-1.1px thin strokes were
       technically rendering (the button was clickable at the right
       spot) but visually disappeared into the dark panel at 16px —
       thickened + filled so it actually reads at panel size. -->
  <polygon points="8,1 14.2,4.5 14.2,11.5 8,15 1.8,11.5 1.8,4.5"
           fill="none" stroke="#00d9ff" stroke-width="1.6" stroke-linejoin="round"/>
  <g stroke="#f0f4f8" stroke-width="1.6" stroke-linecap="round">
    <line x1="8" y1="4" x2="8" y2="12"/>
    <line x1="4.5" y1="6" x2="11.5" y2="10"/>
    <line x1="11.5" y1="6" x2="4.5" y2="10"/>
  </g>
</svg>

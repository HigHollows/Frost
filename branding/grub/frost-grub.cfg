# FROST /etc/default/grub overrides.
#
# Not a full replacement for /etc/default/grub — frost-branding.sh
# merges these key=value pairs into the target's existing file (which
# frost-phase3.sh's grub install already produced), so anything Arch's
# grub package expects to find stays intact.
#
# Minimalist bootloader messages: short timeout, no OS-prober noise
# (single-OS distro, and os-prober can hang/misbehave in VMs), quiet
# graphical boot handed off to Plymouth.

GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu
GRUB_DISTRIBUTOR="FROST"
GRUB_DEFAULT=0

GRUB_THEME="/boot/grub/themes/frost/theme.txt"
GRUB_GFXMODE=1280x720,auto
GRUB_GFXPAYLOAD_LINUX=keep

GRUB_DISABLE_OS_PROBER=true
GRUB_DISABLE_SUBMENU=y

# quiet+splash hand the boot screen to Plymouth instead of a scrolling
# kernel log; loglevel=3 keeps dmesg quiet without hiding real panics.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3"
